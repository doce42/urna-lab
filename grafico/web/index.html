<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração Presidente 2026</title>
<style>
  :root { --bg: #0d1117; --painel: #161b22; --borda: #30363d; --texto: #e6edf3; --fraco: #8b949e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--texto);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px;
    border-bottom: 1px solid var(--borda); background: var(--painel); }
  h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  h1 a { color: var(--fraco); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .grupo { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
  .grupo > span { color: var(--fraco); margin-right: 6px; }
  .grupo[hidden] { display: none; }
  button { background: transparent; color: var(--texto); border: 1px solid var(--borda); padding: 4px 10px;
    border-radius: 6px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--fraco); }
  button.on { background: #1f6feb33; border-color: #1f6feb; }
  #explica { padding: 6px 14px; color: var(--fraco); border-bottom: 1px solid var(--borda); font-size: 12px; }
  #legenda { padding: 6px 14px; border-bottom: 1px solid var(--borda); display: flex; flex-wrap: wrap; gap: 4px; }
  .serie { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; }
  .serie i { width: 14px; height: 0; border-top: 3px solid; display: inline-block; }
  .serie i.trac { border-top-style: dashed; }
  .serie i.pont { border-top-style: dotted; }
  .serie.off { opacity: .35; }
  #leitura { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px 14px; border-bottom: 1px solid var(--borda);
    font-variant-numeric: tabular-nums; min-height: 36px; align-items: center; }
  #leitura b { font-weight: 600; }
  #leitura .h { color: var(--fraco); }
  #leitura .linha { display: flex; flex-wrap: wrap; gap: 4px 18px; width: 100%; }
  #grafico { flex: 1; min-height: 300px; }
</style>
</head>
<body>
<header>
  <h1>Presidente 2026 <a href="relatorio.html">relatório da análise →</a> <a href="mapas.html">mapas da virada →</a></h1>
  <div class="grupo"><span>Turno</span>
    <button data-turno="t2" class="on">2º turno</button>
    <button data-turno="t1">1º turno</button>
    <button data-turno="cmp" title="Os dois turnos no mesmo relógio: 1º tracejado, 2º contínuo">Comparar</button>
  </div>
  <div class="grupo"><span>Ver</span>
    <button data-modo="acum" class="on">Acumulado</button>
    <button data-modo="pct">% acumulado</button>
    <button data-modo="lote">% de cada lote</button>
    <button data-modo="int">Votos por lote</button>
    <button data-modo="desvio">Real − previsto</button>
    <button data-modo="log">Votação ao longo do dia</button>
  </div>
  <div class="grupo" id="g-eixo"><span>Tempo</span>
    <button data-eixo="recebido" class="on" title="Hora em que o boletim de cada urna chegou ao TSE (Brasília)">Chegada no TSE</button>
    <button data-eixo="emissao" title="Hora em que cada urna emitiu o boletim, em horário de Brasília (sem exterior)">Fim na urna</button>
  </div>
  <div class="grupo" id="g-int" hidden><span>Lote</span>
    <button data-int="1">1s</button>
    <button data-int="10">10s</button>
    <button data-int="60" class="on">1min</button>
    <button data-int="300">5min</button>
  </div>
  <div class="grupo"><span>Linha</span>
    <button data-linha="1" class="on" title="Degrau: a linha só muda quando chega dado novo">Degrau</button>
    <button data-linha="0" title="Reta entre um ponto e outro">Reta</button>
  </div>
  <div class="grupo" id="g-prev"><span>Previsto</span>
    <button data-prev="m" class="on" title="Cada urna com o % do 1º turno dela + a virada das outras seções do mesmo município">Município</button>
    <button data-prev="e" title="Cada urna com o % do 1º turno dela + a virada mediana do estado (mais independente)">Estado</button>
    <button data-prev="0">Desligado</button>
  </div>
  <button id="ajustar" title="Mostrar tudo (ou dois cliques no gráfico)">Ver tudo</button>
</header>
<div id="explica"></div>
<div id="legenda"></div>
<div id="leitura"></div>
<div id="grafico"></div>

<script src="lightweight-charts.js"></script>
<script>
// Paleta validada (dataviz/validate_palette.js, tema escuro): vermelho, azul, verde-azulado. Branco e nulo dividem a cor
// e se distinguem pelo traço (branco contínuo, nulo pontilhado espaçado).
const COR_FIXA = { c13: '#ef4444', c22: '#3b82f6', branco: '#0d9488', nulo: '#0d9488' };
const PALETA = ['#22c55e', '#a855f7', '#14b8a6', '#ec4899', '#eab308', '#84cc16', '#06b6d4', '#f97316', '#8b5cf6', '#94a3b8', '#10b981'];
const BASE = Date.UTC(2026, 9, 25) / 1000; // os dois turnos no mesmo relógio: só a hora do dia importa
const NOME_TURNO = { t1: '1º', t2: '2º' };
const PREV = ['p13m', 'p22m', 'p13e', 'p22e'];
const EXPLICA = {
  acum: 'Votos somados até cada momento. Cada degrau é uma ou mais urnas chegando.',
  pct: 'Percentual acumulado até cada momento (candidatos em % dos válidos; branco e nulo em % do total). É a curva que o site do TSE mostrava ao vivo.',
  lote: 'Percentual só das urnas que chegaram dentro de cada lote (1s, 10s, 1min ou 5min), sem misturar com o que já tinha chegado. Mostra para que lado cada leva de urnas puxou. A linha pontilhada é o que essas mesmas urnas deveriam dar pelo próprio 1º turno.',
  int: 'Quantos votos chegaram em cada lote de tempo, por candidato.',
  desvio: 'Diferença, em pontos percentuais, entre o Lula real e o previsto pelo 1º turno de cada urna. Linha grossa: acumulado. Linha fina: só o lote. Perto de zero = as urnas votaram como o próprio histórico indicava.',
  log: 'Quantas pessoas votaram em cada minuto do dia, contado dos logs das urnas (evento "voto computado", horário de Brasília). O log não diz em quem: o voto é secreto.',
};
const estado = { turno: 't2', eixo: 'recebido', modo: 'acum', int: 60, linha: 1, prev: 'm', oculto: new Set() };
const fmtN = n => Math.round(n).toLocaleString('pt-BR');
const fmtP = n => n.toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + '%';
const fmtPP = n => (n >= 0 ? '+' : '−') + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + ' pp';
const hora = t => {
  const s = t - BASE, h = Math.floor(s / 3600);
  return String(h).padStart(2, '0') + new Date(t * 1000).toISOString().slice(13, 19);
};
const curto = n => ({ 'LUIZ INÁCIO LULA DA SILVA': 'Lula', 'FLAVIO NANTES BOLSONARO': 'Flávio', 'LULA': 'Lula', 'FLAVIO BOLSONARO': 'Flávio' })[n]
  || n.split(' ').filter(p => p.length > 2).slice(0, 2).map(p => p[0] + p.slice(1).toLowerCase()).join(' ');

let dados, logs = null, linhas = {}, vista = null;

const el = document.getElementById('grafico');
const chart = LightweightCharts.createChart(el, {
  autoSize: true,
  layout: { background: { type: 'solid', color: '#0d1117' }, textColor: '#8b949e', fontSize: 12 },
  grid: { vertLines: { color: '#1c2128' }, horzLines: { color: '#1c2128' } },
  rightPriceScale: { borderColor: '#30363d' },
  timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: true, rightOffset: 5, minBarSpacing: 0.0005,
    // Só a hora: a data interna é fictícia (os turnos são alinhados no mesmo relógio). Depois da meia-noite aparece 24:xx, 25:xx...
    tickMarkFormatter: (t, tipo) => hora(t).slice(0, tipo === 4 ? 8 : 5) },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  localization: { locale: 'pt-BR', timeFormatter: hora },
  handleScale: { axisPressedMouseMove: { time: true, price: true }, mouseWheel: true, pinch: true },
});

const turnos = () => estado.turno === 'cmp' ? ['t1', 't2'] : [estado.turno];
const cor = (t, c) => COR_FIXA[c] || PALETA[(dados[t].chaves.indexOf(c) - 2) % PALETA.length];
const ehVotavel = c => c[0] === 'c' || c === 'branco' || c === 'nulo';

// Quais linhas aparecem em cada modo. Todas no mesmo painel; clicar no nome esconde.
function definirSeries() {
  const lista = [], cmp = estado.turno === 'cmp';
  const suf = t => cmp ? ' ' + NOME_TURNO[t] : '';
  if (estado.modo === 'log') {
    turnos().forEach(t => logs && logs[t] && lista.push({ id: t + ':log', turno: t, c: 'log', cor: t === 't1' ? '#a3a3a3' : '#e6edf3',
      nome: 'Votos computados' + suf(t), tracejado: cmp && t === 't1', fmt: fmtN }));
    return lista;
  }
  if (estado.modo === 'desvio') {
    ['m', 'e'].forEach(k => {
      const nome = k === 'm' ? 'previsão pelo município' : 'previsão pelo estado';
      lista.push({ id: 'dac' + k, turno: 't2', c: 'dac' + k, cor: k === 'm' ? '#ef4444' : '#f59e0b', nome: 'Acumulado, ' + nome, fmt: fmtPP, largura: 2 });
      lista.push({ id: 'dlo' + k, turno: 't2', c: 'dlo' + k, cor: k === 'm' ? '#fca5a5' : '#fcd34d', nome: 'Só o lote, ' + nome, fmt: fmtPP, largura: 1 });
    });
    return lista;
  }
  const pct = estado.modo === 'pct' || estado.modo === 'lote';
  turnos().forEach(t => {
    const chaves = cmp ? ['c13', 'c22', 'branco', 'nulo'] : dados[t].chaves;
    chaves.forEach(c => lista.push({ id: t + ':' + c, turno: t, c, cor: cor(t, c), nome: curto(dados[t].nomes[c]) + suf(t),
      tracejado: cmp && t === 't1', fmt: pct ? fmtP : fmtN, largura: c === 'c13' || c === 'c22' ? 2 : 1.5 }));
  });
  if (estado.prev !== '0' && turnos().includes('t2')) {
    [['p13', 'Lula previsto', '#fca5a5'], ['p22', 'Flávio previsto', '#93c5fd']].forEach(([p, nome, c]) =>
      lista.push({ id: 't2:' + p + estado.prev, turno: 't2', c: p + estado.prev, cor: c, nome: nome + suf('t2'), pontilhado: true,
        fmt: pct ? fmtP : fmtN, largura: 2 }));
  }
  return lista;
}

// A biblioteca espaça os pontos por quantidade, não por tempo. Por isso todo segundo (ou lote) entre o primeiro
// e o último dado vira um ponto, mesmo sem dado novo: assim o eixo do tempo fica exato.
function montar(series) {
  const ts = [...new Set(series.map(s => s.turno))];
  const porLote = ['lote', 'int', 'log'].includes(estado.modo) || estado.modo === 'desvio';
  const passo = porLote ? estado.int : 1;
  const fonte = t => estado.modo === 'log' ? logs[t] : dados[t][estado.eixo];
  let ini = Infinity, fim = -Infinity;
  ts.forEach(t => { const s = fonte(t); ini = Math.min(ini, s.t[0]); fim = Math.max(fim, s.t[s.t.length - 1]); });
  ini = Math.floor(ini / passo) * passo;
  const pts = {}, info = {};
  series.forEach(s => pts[s.id] = []);
  ts.forEach(t => {
    const s = fonte(t);
    const ch = estado.modo === 'log' ? ['votos'] : dados[t].chaves.concat(PREV.filter(k => s[k]));
    const cands = estado.modo === 'log' ? [] : dados[t].chaves.filter(c => c[0] === 'c');
    const minhas = series.filter(x => x.turno === t);
    const ac = {}; ch.forEach(c => ac[c] = 0);
    let urnas = 0, i = 0;
    info[t] = new Map();
    for (let b = ini; b <= fim; b += passo) {
      const so = {}; ch.forEach(c => so[c] = 0); let noLote = 0;
      while (i < s.t.length && s.t[i] < b + passo) { ch.forEach(c => so[c] += s[c][i]); noLote += s.urnas ? s.urnas[i] : 0; i++; }
      ch.forEach(c => ac[c] += so[c]); urnas += noLote;
      const time = BASE + b;
      const valA = cands.reduce((a, c) => a + ac[c], 0), totA = valA + (ac.branco || 0) + (ac.nulo || 0);
      const valL = cands.reduce((a, c) => a + so[c], 0), totL = valL + (so.branco || 0) + (so.nulo || 0);
      info[t].set(time, { urnas, noLote, valA, valL });
      minhas.forEach(x => {
        let v;
        const base = (c, val, tot) => (c === 'branco' || c === 'nulo') ? tot : val;
        if (estado.modo === 'log') v = so.votos;
        else if (estado.modo === 'acum') v = ac[x.c];
        else if (estado.modo === 'int') v = so[x.c];
        else if (estado.modo === 'pct') v = valA ? 100 * ac[x.c] / base(x.c, valA, totA) : null;
        else if (estado.modo === 'lote') v = valL ? 100 * so[x.c] / base(x.c, valL, totL) : null;
        else if (estado.modo === 'desvio') {
          const k = x.c.slice(-1);
          v = x.c.startsWith('dac') ? (valA ? 100 * (ac.c13 - ac['p13' + k]) / valA : null)
                                    : (valL ? 100 * (so.c13 - so['p13' + k]) / valL : null);
        }
        pts[x.id].push(v == null ? { time } : { time, value: v });  // sem valor = espaço vazio (mantém o tempo exato)
      });
    }
  });
  return { series, pts, info, passo, porLote };
}

function desenhar(manterZoom) {
  const faixa = manterZoom ? chart.timeScale().getVisibleRange() : null;
  Object.values(linhas).forEach(l => chart.removeSeries(l)); linhas = {};
  vista = montar(definirSeries());
  vista.mapa = {};
  vista.series.forEach(s => {
    linhas[s.id] = chart.addSeries(LightweightCharts.LineSeries, {
      color: s.cor, lineWidth: s.largura || 2, lineType: estado.linha,
      lineStyle: s.pontilhado ? LightweightCharts.LineStyle.Dotted : s.tracejado ? LightweightCharts.LineStyle.Dashed
        : s.c === 'nulo' ? LightweightCharts.LineStyle.SparseDotted : LightweightCharts.LineStyle.Solid,
      visible: !estado.oculto.has(s.id), lastValueVisible: true, priceLineVisible: false,
      priceFormat: { type: 'custom', formatter: s.fmt, minMove: 0.001 }, crosshairMarkerRadius: 3,
      // nos lotes, um ponto marca cada lote que teve urna; trecho sem ponto = nenhuma urna chegou
      pointMarkersVisible: ['lote', 'desvio'].includes(estado.modo) && vista.passo >= 10, pointMarkersRadius: 2,
    });
    linhas[s.id].setData(vista.pts[s.id]);
    vista.mapa[s.id] = new Map(vista.pts[s.id].map(p => [p.time, p.value]));
  });
  if (faixa) { try { chart.timeScale().setVisibleRange(faixa); } catch (e) { chart.timeScale().fitContent(); } }
  else chart.timeScale().fitContent();
  legenda(); ler(null); textos();
}

function legenda() {
  const L = document.getElementById('legenda');
  L.innerHTML = '';
  vista.series.forEach(s => {
    const b = document.createElement('button');
    b.className = 'serie' + (estado.oculto.has(s.id) ? ' off' : '');
    b.innerHTML = `<i class="${s.pontilhado || s.c === 'nulo' ? 'pont' : s.tracejado ? 'trac' : ''}" style="border-color:${s.cor}"></i>${s.nome}`;
    b.title = 'Clique para esconder ou mostrar';
    b.onclick = () => {
      estado.oculto.has(s.id) ? estado.oculto.delete(s.id) : estado.oculto.add(s.id);
      b.classList.toggle('off'); linhas[s.id].applyOptions({ visible: !estado.oculto.has(s.id) });
      ler(null);
    };
    L.appendChild(b);
  });
}

function textos() {
  let t = EXPLICA[estado.modo];
  if (estado.modo !== 'log') t += estado.eixo === 'recebido' ? ' Tempo: chegada do boletim ao TSE.' : ' Tempo: fim da votação na urna, em horário de Brasília (exterior fora).';
  if (estado.turno === 'cmp') t += ' Comparar: 1º turno tracejado, 2º contínuo, no mesmo relógio.';
  t += ' Roda do mouse dá zoom, arrastar move, dois cliques mostram tudo.';
  document.getElementById('explica').textContent = t;
}

let ultimo = null;
function ler(time) {
  if (time != null) ultimo = time;
  const L = document.getElementById('leitura');
  const ts = [...new Set(vista.series.map(s => s.turno))];
  const tempos = [...vista.info[ts[0]].keys()];
  let t = time ?? ultimo;
  if (t == null || !vista.info[ts[0]].has(t)) t = tempos[tempos.length - 1];
  L.innerHTML = ts.map(tu => {
    const inf = vista.info[tu].get(t); if (!inf) return '';
    const p = [`<span class="h">${ts.length > 1 ? NOME_TURNO[tu] + ' turno · ' : ''}${hora(t)}${vista.porLote && vista.passo > 1 ? ` (lote de ${vista.passo}s)` : ''}</span>`];
    vista.series.filter(s => s.turno === tu && !estado.oculto.has(s.id)).forEach(s => {
      const v = vista.mapa[s.id].get(t);
      p.push(`<span style="color:${s.cor}">${s.nome} <b>${v == null ? '—' : s.fmt(v)}</b></span>`);
    });
    if (estado.modo !== 'log') p.push(`<span class="h">urnas somadas ${fmtN(inf.urnas)}${inf.noLote ? ` · ${fmtN(inf.noLote)} neste ${vista.porLote ? 'lote' : 'segundo'}` : ''}</span>`);
    return `<div class="linha">${p.join('')}</div>`;
  }).join('');
}

chart.subscribeCrosshairMove(e => { if (vista) ler(e.time ?? null); });
el.addEventListener('dblclick', () => chart.timeScale().fitContent());
document.getElementById('ajustar').onclick = () => chart.timeScale().fitContent();

function visiveis() {
  const m = estado.modo;
  document.getElementById('g-int').hidden = !['lote', 'int', 'desvio', 'log'].includes(m);
  document.getElementById('g-eixo').hidden = m === 'log';
  document.getElementById('g-prev').hidden = estado.turno === 't1' || ['int', 'desvio', 'log'].includes(m);
  // desvio só existe no 2º turno (precisa do 1º para prever)
  if (m === 'desvio' && estado.turno !== 't2') clicar('turno', 't2');
  document.querySelector('[data-modo="log"]').hidden = !logs;
}
function clicar(attr, valor) {
  estado[attr] = valor;
  document.querySelectorAll(`[data-${attr}]`).forEach(x => x.classList.toggle('on', x.dataset[attr] === String(valor)));
}
function grupo(attr, conv) {
  document.querySelectorAll(`[data-${attr}]`).forEach(b => b.onclick = () => {
    clicar(attr, conv(b.dataset[attr])); visiveis();
    desenhar(!['eixo', 'turno', 'modo'].includes(attr));
  });
}
grupo('turno', String); grupo('eixo', String); grupo('modo', String); grupo('int', Number); grupo('linha', Number); grupo('prev', String);

Promise.all([
  fetch('dados.json').then(r => r.json()),
  fetch('logs.json').then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([d, l]) => { dados = d; logs = l; visiveis(); desenhar(false); });
</script>
</body>
</html>
